  <body>
    <div id="root"></div>
    <script>
      // 检测主 JS 加载失败（通常是 SW 缓存了旧 index.html 导致 404），清除缓存并硬刷新
      (function () {
        window.addEventListener('error', function (e) {
          var target = e.target;
          if (target && target.tagName === 'SCRIPT' && target.src) {
            sessionStorage.setItem('__reload_attempted__', '1');
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
                  location.reload();
                });
              });
            } else {
              location.reload();
            }
          }
        }, true);
      })();
    </script>
  </body>
